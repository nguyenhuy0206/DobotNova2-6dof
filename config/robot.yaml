# Dobot Nova 2 — hardware + safety limits.
# Env overrides: NOVA2_IP, NOVA2_UI_PORT

ip: 192.168.5.1          # robot LAN1; Mac Ethernet = 192.168.5.100/24
timeout_s: 3.0

ui_host: 127.0.0.1       # keep local-only
ui_port: 8765

speed:                   # percent, used for SpeedJ/AccJ and SpeedFactor
  min: 1
  max: 100

joint_step:              # relative jog, degrees
  min_deg: 0.1
  max_deg: 20.0

# Cartesian safety box in robot base frame (mm). PLACEHOLDER values —
# measure your cell (table height, walls, camera mount) before relying on it.
workspace:
  x: [-600, 600]
  y: [-600, 600]
  z: [0, 700]

motion:                  # primitive skills (src/actions/primitives.py)
  joint_limits_deg: [360, 180, 156, 360, 360, 360]
  max_relative_mm: 100   # largest move_relative translation per call
  max_relative_deg: 45
  default_speed: 20      # % when a skill call omits speed
  arrive_tol_mm: 1.0
  arrive_tol_deg: 0.5
  move_timeout_s: 30     # robot is stopped if a move doesn't arrive in time
  home_joints: [0, 0, 90, 0, 90, 0]   # PLACEHOLDER — teach a real 'home' with save_position

gripper:                 # DH-Robotics PGC over RS485 (Modbus RTU)
  tool_length_mm: 118    # flange -> fingertip (mm), measured 11.8 cm; pick/place skills add it
  transport: direct      # direct = USB–RS485 adapter on this Mac; controller = via Nova 2
  port: null             # null = auto-detect /dev/cu.usbserial-*
  slave_id: 1
  baud: 115200
  parity: N
  force: 30              # 20–100 %
  speed: 50              # 1–100 %
  open_position: 1000    # ‰ of stroke
  closed_position: 0

# Camera windows in the Debug tab, streamed at `fps` to the browser.
# macOS numbers cameras in an order that changes when devices are plugged in, so
# pick the device from the dropdown in each window; the choice is remembered in
# data/memory/cameras.json and overrides `index` here.
cameras:
  env:
    label: "Environment · RealSense D455"
    source: opencv       # opencv = D455 colour as a webcam (no sudo); realsense = colour + depth (needs pyrealsense2, sudo on macOS)
    index: 1
    width: 1280
    height: 720
    fps: 10
  wrist:
    label: "Wrist · USB webcam"
    source: opencv
    index: 0
    width: 640
    height: 480
    fps: 10
