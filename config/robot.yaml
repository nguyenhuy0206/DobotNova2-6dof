# Dobot Nova 2 — hardware + safety limits.
# Env overrides: NOVA2_IP, NOVA2_UI_PORT

ip: 192.168.5.1          # robot LAN1; Mac Ethernet = 192.168.5.100/24
timeout_s: 3.0

ui_host: 127.0.0.1       # keep local-only
ui_port: 8765

speed:                   # percent, used for SpeedJ/AccJ and SpeedFactor
  min: 1
  max: 100

joint_step:              # relative jog, degrees
  min_deg: 0.1
  max_deg: 20.0

# Cartesian limits in the robot base frame (mm), checked for the fingertip AND the flange on every
# move. Surveyed 18 Nov 2026 by hand-guided touches (data/memory/workcell_survey.json):
#   reach along the table edge 707–717 mm (fingertip, gripper tilted) -> radius 690 (20 mm margin)
#   highest pose the operator allows (zmax): flange z 528 -> z max 530 (home: 524)
# The table floor comes from data/memory/workcell.json (table_z_mm), not from z[0].
workspace:
  x: [-720, 720]
  y: [-720, 720]
  z: [0, 530]
  max_radius_mm: 690
  keep_out:             # vertical cylinders the fingertip and flange must not enter
    # D455 after the 18 Nov move: touches front/back/side (camera455_*), every contact candidate
    # (gripper centre or either open fingertip) within 96 mm of (-5, -632), z 114–154 -> +40 mm margin
    - {name: D455, xy: [-5, -632], radius_mm: 135, z: [0, 220]}

motion:                  # primitive skills (src/actions/primitives.py)
  joint_limits_deg: [360, 180, 156, 360, 360, 360]
  max_relative_mm: 100   # largest move_relative translation per call
  max_relative_deg: 45
  default_speed: 20      # % when a skill call omits speed
  arrive_tol_mm: 1.0
  arrive_tol_deg: 0.5
  move_timeout_s: 30     # robot is stopped if a move doesn't arrive in time
  home_joints: [0, 0, 90, 0, 90, 0]   # PLACEHOLDER — teach a real 'home' with save_position

gripper:                 # DH-Robotics PGC over RS485 (Modbus RTU)
  tool_length_mm: 127.1  # flange -> centre between the fingertips (mm), from touches 18 Nov 2026
                         #   (fit residual ~1 mm; was 118 from a tape measure)
  finger_half_gap_mm: 31.6   # open fingertips off the axis (flange Y): the table floor is checked on the lower one
  transport: direct      # direct = USB–RS485 adapter on this Mac; controller = via Nova 2
  via_ui: true           # only ui/app.py opens the bus; episodes/scripts go through it (one Modbus master)
  port: null             # null = auto-detect /dev/cu.usbserial-*
  slave_id: 1
  baud: 115200
  parity: N
  force: 30              # 20–100 %
  speed: 50              # 1–100 %
  open_position: 1000    # ‰ of stroke
  closed_position: 0

# Camera windows in the Debug tab, streamed at `fps` to the browser.
# macOS numbers cameras in an order that changes when devices are plugged in, so
# pick the device from the dropdown in each window; the choice is remembered in
# data/memory/cameras.json and overrides `index` here.
cameras:
  env:
    label: "Environment · RealSense D455"
    source: opencv       # opencv = D455 colour as a webcam (no sudo); realsense = colour + depth (needs pyrealsense2, sudo on macOS)
    index: 1
    width: 1280
    height: 720
    fps: 10
  wrist:
    label: "Wrist · USB webcam"
    source: opencv
    index: 0
    width: 640
    height: 480
    fps: 10
