# Astra agent harness.
# Env overrides: ASTRA_MODEL, ASTRA_EXECUTION_MODE, ASTRA_BASE_URL.
# API key: `gpt6-key=...` in .env (git-ignored); falls back to OPENAI_API_KEY exported in your shell.

model: gpt-6-astra
api_key_env: gpt6-key     # name of the key variable in .env
# Where requests go. The key in .env is a modelapi.vn key (OpenAI-compatible Responses API),
# so it only works with this base_url. Empty = api.openai.com (for a key from OpenAI itself).
base_url: https://modelapi.vn/v1
max_output_tokens: 1000
max_steps: 20            # model ⇄ tool round-trips per task
reasoning_summary: auto   # 20 Nov: log a summary of Astra's reasoning per request (episode 'model' events)
max_speed: 50            # % cap when fixed_speed is unset; 20 Nov: 4 -> 20 -> 50 (operator)
fixed_speed: 50          # 20 Nov (operator): every motion at exactly 50 %, whatever speed Astra asks for

# dry_run  validate tool calls, never touch hardware   (default — start here)
# confirm  ask on the terminal before each motion/gripper tool
# live     run tools directly (validation + safety checks still apply)
execution_mode: dry_run

# Restrict which actions the model may call. Empty = everything in
# src/actions/registry.py.
allowed_tools:
  - get_state
  - move_to_pose
  - move_to_joints
  - move_relative
  - jog_joint
  - go_to_position
  - save_position
  - open_gripper
  - close_gripper
  - set_gripper
  - stop
  # perception (perception/scene.py)
  - look
  - find_objects
  - search_object
  # composite skills (actions/skill_runner.py, data/memory/skills.json)
  - list_skills
  - run_skill
  - save_skill

# Leave empty to use agent.harness.DEFAULT_INSTRUCTIONS.
system_prompt: ""
